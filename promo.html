<html lang="en"><head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #202830; }
  body {
    width: 1200px;
    height: 627px;
    background-color: #202830;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* Grid texture */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(247,245,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247,245,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Green glow */
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 38% 50%, rgba(0,224,84,0.16) 0%, transparent 58%);
  }

  /* Right side: mock of the injected sources panel */
  .panel {
    position: absolute;
    right: 55px;
    top: 50%;
    transform: translateY(-50%);
    width: 320px;
    background: rgba(247,245,255,0.05);
    border: 1px solid #2c3742;
    border-radius: 10px;
    padding: 18px 20px 20px;
  }

  .panel-heading {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #b0bcc8;
    padding-bottom: 12px;
    border-bottom: 1px solid #2c3742;
    margin-bottom: 4px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(44,55,66,0.7);
  }

  .row:last-child { border-bottom: none; }

  .row-dim { opacity: 0.4; }

  .brand {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    flex-shrink: 0;
    background: rgba(247,245,255,0.1);
  }

  .brand-a { background: #00e054; }
  .brand-b { background: #ff8000; }
  .brand-c { background: #40bcf4; }

  .row-name {
    font-size: 14px;
    color: #f7f5ff;
    flex: 1;
  }

  .pill {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.09em;
    color: #202830;
    background: #00e054;
    border-radius: 3px;
    padding: 3px 7px;
  }

  .pill-native {
    color: #b0bcc8;
    background: rgba(176,188,200,0.18);
  }

  /* Main content */
  .content {
    position: relative;
    z-index: 10;
    padding: 0 80px;
  }

  .eyebrow {
    font-size: 12px;
    color: #b0bcc8;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 22px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #00e054;
    flex-shrink: 0;
  }

  h1 {
    font-size: 52px;
    font-weight: 700;
    color: #f7f5ff;
    line-height: 1.1;
    letter-spacing: -0.02em;
    max-width: 520px;
  }

  h1 .highlight {
    color: #00e054;
  }

  .tagline {
    font-size: 18px;
    color: #7a8590;
    margin-top: 18px;
    font-weight: 400;
    line-height: 1.55;
    max-width: 460px;
  }

  .tags {
    margin-top: 28px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 12px;
    color: #b0bcc8;
    border: 1px solid rgba(176,188,200,0.28);
    border-radius: 999px;
    padding: 4px 14px;
    background: rgba(247,245,255,0.04);
  }

  .url-label {
    position: absolute;
    bottom: 30px;
    left: 80px;
    font-size: 11px;
    color: rgba(176,188,200,0.35);
    letter-spacing: 0.07em;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <!-- Mock injected panel on the right -->
  <div class="panel">
    <div class="panel-heading">Alternative</div>
    <div class="row">
      <span class="brand brand-a"></span>
      <span class="row-name">JustWatch</span>
      <span class="pill">ALT</span>
    </div>
    <div class="row">
      <span class="brand brand-b"></span>
      <span class="row-name">YouTube</span>
      <span class="pill">ALT</span>
    </div>
    <div class="row">
      <span class="brand brand-c"></span>
      <span class="row-name">Internet Archive</span>
      <span class="pill">ALT</span>
    </div>
    <div class="row row-dim">
      <span class="brand"></span>
      <span class="row-name">Stream</span>
      <span class="pill pill-native">SUBS</span>
    </div>
  </div>

  <div class="content">
    <div class="eyebrow"><span class="dot"></span>Chrome Extension</div>
    <h1>Letterboxd<br>Alternative <span class="highlight">Sources</span></h1>
    <p class="tagline">Your own search links,<br>right where you look for a film.</p>
    <div class="tags">
      <span class="tag">#javascript</span>
      <span class="tag">#chrome-extension</span>
      <span class="tag">#manifest-v3</span>
      <span class="tag">#letterboxd</span>
    </div>
  </div>
  <div class="url-label">chrome web store</div>
</body></html>
